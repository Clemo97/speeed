name: Speeed

options:
  bundleIdPrefix: com.speeed
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
  xcodeVersion: "16.3"

packages:
  ComposableArchitecture:
    url: https://github.com/pointfreeco/swift-composable-architecture
    from: 1.15.0
  Supabase:
    url: https://github.com/supabase-community/supabase-swift
    from: 2.0.0
  PowerSync:
    url: https://github.com/powersync-ja/powersync-swift
    from: 1.0.0

targets:
  Speeed:
    type: application
    platform: iOS
    deploymentTarget: "17.0"
    sources:
      - Speeed
    info:
      path: Speeed/Info.plist
      properties:
        UILaunchScreen: {}
        NSLocationWhenInUseUsageDescription: "Speeed tracks your GPS location during runs."
        NSLocationAlwaysAndWhenInUseUsageDescription: "Speeed tracks your GPS location in the background to continue run tracking when you switch apps."
        UIBackgroundModes:
          - location
        CFBundleURLTypes:
          - CFBundleURLSchemes:
              - "com.speeed"
            CFBundleURLName: "com.speeed"
    entitlements:
      path: Speeed/Speeed.entitlements
      properties:
        com.apple.developer.applesignin:
          - Default
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.speeed.app
        SWIFT_VERSION: "5.10"
        DEVELOPMENT_TEAM: ""
        CODE_SIGN_STYLE: Automatic
    dependencies:
      - package: ComposableArchitecture
        product: ComposableArchitecture
      - package: Supabase
        product: Supabase
      - package: PowerSync
        product: PowerSync

schemes:
  Speeed:
    build:
      targets:
        Speeed: all
    run:
      config: Debug
      environmentVariables:
        SUPABASE_URL:
          value: ""
          isEnabled: false
        SUPABASE_ANON_KEY:
          value: ""
          isEnabled: false
        POWERSYNC_URL:
          value: ""
          isEnabled: false
    test:
      config: Debug
    profile:
      config: Release
    analyze:
      config: Debug
    archive:
      config: Release
